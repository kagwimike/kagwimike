<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="bgp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f0c29"/>
    </linearGradient>
  </defs>

  <rect width="600" height="120" fill="url(#bgp)" rx="12"/>

  <!-- Stars -->
  <circle cx="50" cy="20" r="1.5" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="50" r="1" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="15" r="1.5" fill="white" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="35" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="20" r="1.5" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="530" cy="45" r="1" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="570" cy="18" r="1.5" fill="white" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Rocket group - moves across screen -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80,0;680,0" dur="5s" repeatCount="indefinite"/>

    <!-- Flame -->
    <ellipse cx="0" cy="72" rx="6" ry="12" fill="#f97316" opacity="0.9">
      <animate attributeName="ry" values="12;16;10;14;12" dur="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="0.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="70" rx="4" ry="8" fill="#fbbf24">
      <animate attributeName="ry" values="8;12;6;10;8" dur="0.25s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Rocket body -->
    <ellipse cx="0" cy="50" rx="10" ry="22" fill="#6d28d9"/>
    <!-- Nose cone -->
    <path d="M-10 35 Q0 10 10 35Z" fill="#a78bfa"/>
    <!-- Window -->
    <circle cx="0" cy="44" r="5" fill="#bfdbfe"/>
    <circle cx="0" cy="44" r="3" fill="#93c5fd"/>
    <!-- Wings -->
    <path d="M-10 60 L-18 75 L-10 68Z" fill="#5b21b6"/>
    <path d="M10 60 L18 75 L10 68Z" fill="#5b21b6"/>

    <!-- Trail particles -->
    <circle cx="-20" cy="72" r="2" fill="#f97316" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-35" cy="70" r="1.5" fill="#fbbf24" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0" dur="0.5s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="-50" cy="73" r="1" fill="#f97316" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
  </g>

  <!-- Text label -->
  <text x="300" y="68" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#a78bfa" letter-spacing="4">
    FEATURED PROJECTS
  </text>
  <text x="300" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#60a5fa" opacity="0.7" letter-spacing="2">
    production-ready systems
  </text>
</svg>
