<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>

  <!-- Desk -->
  <rect x="60" y="210" width="280" height="12" rx="4" fill="#2d2b55"/>
  <rect x="90" y="222" width="10" height="50" rx="3" fill="#2d2b55"/>
  <rect x="300" y="222" width="10" height="50" rx="3" fill="#2d2b55"/>

  <!-- Monitor stand -->
  <rect x="183" y="195" width="34" height="18" rx="3" fill="#3d3b6e"/>
  <rect x="160" y="210" width="80" height="6" rx="3" fill="#3d3b6e"/>

  <!-- Monitor -->
  <rect x="100" y="90" width="200" height="110" rx="8" fill="#1a1040"/>
  <rect x="107" y="97" width="186" height="96" rx="5" fill="url(#screen)"/>

  <!-- Code lines on screen - animated -->
  <g filter="url(#glow)">
    <!-- Line 1 -->
    <rect x="117" y="107" width="0" height="6" rx="2" fill="#a78bfa">
      <animate attributeName="width" values="0;80;80;80;0" dur="3s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <!-- Line 2 -->
    <rect x="127" y="118" width="0" height="6" rx="2" fill="#60a5fa">
      <animate attributeName="width" values="0;60;60;60;0" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <!-- Line 3 -->
    <rect x="127" y="129" width="0" height="6" rx="2" fill="#34d399">
      <animate attributeName="width" values="0;100;100;100;0" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <!-- Line 4 -->
    <rect x="127" y="140" width="0" height="6" rx="2" fill="#60a5fa">
      <animate attributeName="width" values="0;70;70;70;0" dur="3s" repeatCount="indefinite" begin="0.9s"/>
    </rect>
    <!-- Line 5 -->
    <rect x="127" y="151" width="0" height="6" rx="2" fill="#f472b6">
      <animate attributeName="width" values="0;50;50;50;0" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
    <!-- Line 6 -->
    <rect x="117" y="162" width="0" height="6" rx="2" fill="#a78bfa">
      <animate attributeName="width" values="0;90;90;90;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <!-- Cursor blink -->
    <rect x="117" y="174" width="6" height="8" rx="1" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Person body -->
  <ellipse cx="200" cy="258" rx="38" ry="12" fill="#1e1b4b" opacity="0.5"/>
  <!-- Torso -->
  <rect x="178" y="220" width="44" height="40" rx="8" fill="#6d28d9"/>
  <!-- Shirt detail -->
  <rect x="196" y="222" width="8" height="16" rx="2" fill="#5b21b6"/>

  <!-- Arms -->
  <!-- Left arm -->
  <path d="M 178 230 Q 155 240 148 248" stroke="#f3d5b5" stroke-width="8" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-5 178 230;5 178 230;-5 178 230" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Right arm -->
  <path d="M 222 230 Q 245 240 252 248" stroke="#f3d5b5" stroke-width="8" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="5 222 230;-5 222 230;5 222 230" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Hands on keyboard -->
  <ellipse cx="148" cy="250" rx="10" ry="7" fill="#f3d5b5"/>
  <ellipse cx="252" cy="250" rx="10" ry="7" fill="#f3d5b5"/>

  <!-- Head -->
  <circle cx="200" cy="205" r="22" fill="#f3d5b5"/>
  <!-- Hair -->
  <path d="M 178 200 Q 180 183 200 181 Q 220 183 222 200 Q 215 188 200 188 Q 185 188 178 200Z" fill="#2d1b00"/>
  <!-- Eyes -->
  <ellipse cx="193" cy="205" rx="3" ry="3.5" fill="#1a0a00">
    <animate attributeName="ry" values="3.5;0.5;3.5" dur="4s" repeatCount="indefinite" begin="1s"/>
  </ellipse>
  <ellipse cx="207" cy="205" rx="3" ry="3.5" fill="#1a0a00">
    <animate attributeName="ry" values="3.5;0.5;3.5" dur="4s" repeatCount="indefinite" begin="1s"/>
  </ellipse>
  <!-- Smile -->
  <path d="M 194 213 Q 200 218 206 213" stroke="#c0774a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Floating code symbols -->
  <text x="40" y="80" font-family="monospace" font-size="14" fill="#a78bfa" opacity="0">
    &lt;/&gt;
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="0s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,-40" dur="4s" repeatCount="indefinite" begin="0s"/>
  </text>
  <text x="330" y="120" font-family="monospace" font-size="12" fill="#60a5fa" opacity="0">
    { }
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,-40" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </text>
  <text x="350" y="80" font-family="monospace" font-size="11" fill="#34d399" opacity="0">
    ( )
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,-40" dur="4s" repeatCount="indefinite" begin="2.5s"/>
  </text>
  <text x="30" y="150" font-family="monospace" font-size="13" fill="#f472b6" opacity="0">
    =>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="3.5s"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-20;0,-40" dur="4s" repeatCount="indefinite" begin="3.5s"/>
  </text>

  <!-- Keyboard -->
  <rect x="130" y="245" width="140" height="20" rx="4" fill="#2d2b55"/>
  <rect x="135" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="147" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="159" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="171" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="183" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="195" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="207" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="219" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="231" y="248" width="8" height="5" rx="1" fill="#3d3b6e"/>
  <rect x="243" y="248" width="22" height="5" rx="1" fill="#a78bfa"/>
  <rect x="150" y="256" width="100" height="5" rx="1" fill="#3d3b6e"/>
</svg>
